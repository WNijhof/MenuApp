services:
  backend:
    image: ghcr.io/wnijhof/menuapp-backend:latest
    build: ./backend
    restart: unless-stopped
    volumes:
      - menuapp-data:/data
    environment:
      - DATABASE_PATH=/data/menuapp.db

  frontend:
    image: ghcr.io/wnijhof/menuapp-frontend:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  menuapp-data:
